# SonarQube Cloud (formerly SonarCloud) analysis config.
# organization/projectKey: fill these in when the SonarQube Cloud account/project is created —
# sonarcloud.io > Import project > (after import) Administration > "Update your project key
# and organization key" shows both. Until SONAR_TOKEN also exists as a GitHub secret, the CI
# step that reads this file is skipped entirely (see .github/workflows/ci.yml), so a placeholder
# here causes no false analysis run.
sonar.organization=REPLACE_WITH_SONARCLOUD_ORGANIZATION_KEY
sonar.projectKey=REPLACE_WITH_SONARCLOUD_PROJECT_KEY

sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/vite-env.d.ts,src/main.tsx,src/types/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
